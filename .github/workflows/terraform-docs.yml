name: Terraform docs

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-docs/gh-actions@v1
        with:
          working-dir: terraform
          output-file: README.md
          output-method: replace
          git-push: "true"
